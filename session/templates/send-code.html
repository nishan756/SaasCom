<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        .code-box {
            display: inline-block;
            font-size: 28px;
            letter-spacing: 6px;
            font-weight: bold;
            background: #f1f3f5;
            padding: 15px 25px;
            border-radius: 8px;
            margin: 20px 0;
            color: #212529;
        }

        .footer {
            font-size: 12px;
            color: #6c757d;
            text-align: center;
            padding: 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Email Verification</h2>
    </div>

    <div class="content">

        <p>Hello <strong>{{ full_name }}</strong>,</p>

        <p>Your code is</p>

        <div class="code-box">
            {{ code }}
        </div>

        <p>This code will expire in <strong>10 minutes</strong>.</p>

        <p>If you did not request this change, you can safely ignore this email.</p>

    </div>

    <div class="footer">
        © {{ year }} SaasCom. All rights reserved.
    </div>

</div>

</body>
</html>
