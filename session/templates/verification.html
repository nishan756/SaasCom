{% extends 'base.html' %}

{% block title %}
    Email Verification
{% endblock title %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card">
                <div class="card-body">

                    <h4 class="mb-3">Email Verification</h4>

                    <p class="text-muted">
                        Enter the verification code sent to your new email.
                    </p>

                    <form method="POST" action="{% url 'verify-email' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Verification Code</label>
                            <input type="text"
                                   name="code"
                                   class="form-control"
                                   placeholder="Enter code"
                                   maxlength="6"
                            >
                        </div>

                        <button class="btn btn-success w-100">
                            Verify
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
